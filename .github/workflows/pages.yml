name: Deploy GitHub Pages

# Data is fetched at deploy time instead of being committed back by a separate
# daily job, so the site is never more than an hour behind GitHub and the blog,
# and `main` is no longer flooded with "sync homepage data" commits.
on:
  push:
    branches: [main]
  schedule:
    # Hourly, off the top of the hour when GitHub's scheduler is most congested.
    - cron: '23 * * * *'
  # The blog's deploy workflow can call this for an instant refresh:
  #   gh api repos/IchenDEV/home-page/dispatches -f event_type=blog-published
  repository_dispatch:
    types: [blog-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GITHUB_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
      GH_USER: ${{ github.repository_owner }}
      BLOG_URL: https://blogs.idevlab.dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Always the newest Node release; an LTS retry below covers the case
          # where a new major breaks the fetch script.
          node-version: latest

      # The fetch script carries over any section whose source fails, so start
      # from whichever snapshot is newer: the committed one or the live one.
      # Best effort: the committed snapshot is a fine starting point too.
      - name: Pick the newest previous snapshot
        continue-on-error: true
        run: |
          curl -fsSL --max-time 20 "https://www.idevlab.dev/data/github.json?t=$(date +%s)" -o /tmp/live.json
          node -e '
            const fs = require("fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } };
            const live = read("/tmp/live.json");
            const repo = read("data/github.json");
            if (live?.generated_at && (!repo || live.generated_at > repo.generated_at)) {
              fs.copyFileSync("/tmp/live.json", "data/github.json");
              console.log(`using live snapshot from ${live.generated_at}`);
            } else {
              console.log(`using committed snapshot from ${repo?.generated_at}`);
            }
          '

      - name: Refresh data (latest Node)
        id: fetch
        continue-on-error: true
        run: npm run fetch

      # A failure here is either a flaky source or a Node release that broke
      # the script; one retry on LTS tells the two apart and keeps data fresh.
      - name: Fall back to Node LTS
        if: steps.fetch.outcome == 'failure'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Refresh data (Node LTS)
        id: fetch_lts
        if: steps.fetch.outcome == 'failure'
        continue-on-error: true
        run: npm run fetch

      - name: Report the LTS fallback
        if: steps.fetch.outcome == 'failure' && steps.fetch_lts.outcome == 'success'
        run: |
          echo "::warning::Fetch failed on the latest Node but passed on LTS $(node -v). If this repeats, the newest Node likely broke scripts/fetch-github.mjs."

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets css data js vendor _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4+ skips dotfiles by default; keep .nojekyll in the artifact.
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # The previous snapshot is already live, so the site is fine — but fail
      # the run so GitHub sends a notification instead of going stale silently.
      - name: Fail when no fresh data was published
        if: steps.fetch.outcome == 'failure' && steps.fetch_lts.outcome != 'success'
        run: |
          echo "::error::Data refresh failed on both latest Node and LTS; the site is serving the previous snapshot."
          exit 1
