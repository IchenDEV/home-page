name: Sync homepage data

on:
  schedule:
    # GitHub Actions cron uses UTC: 03:00 UTC = 11:00 Asia/Shanghai/Singapore.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh GitHub and blog data
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
          GH_USER: ${{ github.repository_owner }}
          BLOG_URL: https://blogs.idevlab.dev
        run: npm run fetch

      - name: Publish refreshed snapshot
        run: |
          if git diff --quiet -- data/github.json; then
            echo "Snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git commit -m "chore: sync homepage data"
          git pull --rebase origin main
          git push origin HEAD:main
